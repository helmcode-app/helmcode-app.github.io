keywords: "iPad AI coding, iPad IDE, iPad code editor, iPadOS programming, mobile coding console, CodeMirror 6 iPad, self-hosted coding daemon, runner-core, ACP protocol, OpenCode, Claude iPad coding, WebSSH iPad, xterm.js iPadOS, iPad developer console"
