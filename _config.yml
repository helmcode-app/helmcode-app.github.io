# HelmCode Official Site Jekyll Configuration
title: "HelmCode - Mobile-First iPad AI Coding Console"
tagline: "Mobile-First iPad AI Coding Console"
description: "A professional, mobile-first AI coding environment built for iPad. Featuring a pure SwiftUI shell, CodeMirror 6 editor, multi-model Agent Commander, and a self-hosted WebSocket VFS runner daemon."
url: "https://helmcode-app.github.io"
baseurl: ""
repository: "helmcode-app/helmcode-app.github.io"
github_username: "helmcode-app"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - .git
  - .github
