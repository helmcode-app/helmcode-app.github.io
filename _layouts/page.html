---
layout: default
---
<div class="legal-page-container">
  <div class="legal-header">
    <div class="legal-badge">Legal &amp; Compliance</div>
    <h1 class="legal-title">{{ page.title }}</h1>
    <div class="legal-meta">
      <span>Last Updated: {{ page.last_modified_at | default: page.date | default: "November 10, 2026" }}</span>
      <span class="meta-separator">•</span>
      <span>Applies to HelmCode Client &amp; runner-core</span>
    </div>
  </div>

  <div class="legal-layout">
    <article class="legal-content markdown-body">
      {{ content }}
    </article>
  </div>
</div>
